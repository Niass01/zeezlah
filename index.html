  function showCopied() {
    var original = shareLabel.textContent;
    shareLabel.textContent = 'Link copied!';
    setTimeout(function () { shareLabel.textContent = original; }, 1800);
  }

  async function copyLink() {
    try {
      await navigator.clipboard.writeText(window.location.href);
      showCopied();
    } catch (e) {
      // Clipboard API unavailable (e.g. insecure context) — nothing more we can do silently.
    }
  }

  shareBtn.addEventListener('click', async function () {
    var shareData = {
      title: 'Zeezlah Supermarket',
      text: 'Your everyday essentials · Affordable skincare & beauty products.',
      url: window.location.href,
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
        return; // share sheet completed — nothing more to do
      } catch (err) {
        // Falls through to the clipboard copy below on ANY rejection, deliberately
        // including AbortError. Spec-wise AbortError should mean "user cancelled",
        // but some browsers/environments (no share targets configured) also reject
        // with AbortError even though the user never saw a share sheet — those two
        // cases aren't reliably distinguishable. Always copying is the safer default:
        // worst case a cancelling user gets an unwanted (harmless) clipboard copy;
        // the alternative is the button silently doing nothing for those environments.
      }
    }
    await copyLink();
  });
</script>

</body>
